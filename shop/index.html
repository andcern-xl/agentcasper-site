<style>
  :root { --obsidian:#070709; --paper:#fff; --cloud:#f5f5f5; --charcoal:#60606c; --hairline:#d9d9e2; --blue:#2597d0; --display:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --ui:"Inter",ui-sans-serif,system-ui,sans-serif; --shadow-btn: rgba(36,36,40,.1) 0 1px 2px, rgba(36,36,40,.09) 0 3px 3px, rgba(36,36,40,.05) 0 6px 4px; }
  * { box-sizing: border-box; }
  html,body { overflow-x: hidden; }
  body { margin: 0; background: var(--cloud); color: var(--obsidian); font: 400 17px/1.5 var(--display); letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  header { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 1px solid rgba(0,0,0,.08); }
  .bar { max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
  .bar a { text-decoration: none; font-weight: 700; font-size: 18px; letter-spacing: -.03em; }
  .bar a.back { font: 500 14px var(--ui); }
  main { max-width: 1100px; margin: 0 auto; padding: 48px 24px 96px; }
  h1 { font-size: clamp(32px, 6vw, 48px); letter-spacing: -.04em; line-height: 1.05; margin: 0 0 8px; }
  .lede { color: var(--charcoal); margin: 0 0 36px; }
  .grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .tile { background: var(--paper); border-radius: 18px; padding: 14px 14px 18px; text-decoration: none; box-shadow: rgba(16,55,132,.05) 0 10px 30px; }
  .tile-img { aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #ececf2; margin-bottom: 12px; }
  .tile-img img, .main-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile h3 { margin: 0 0 2px; font-size: 17px; letter-spacing: -.02em; }
  .price { margin: 0; color: var(--charcoal); font: 500 15px var(--ui); }
  .price.big { color: var(--obsidian); font-size: 22px; margin: 4px 0 16px; }
  .empty { color: var(--charcoal); padding: 40px 0; }
  .product-grid { display: grid; gap: 40px; grid-template-columns: 1fr 1fr; align-items: start; }
  @media (max-width: 800px) { .product-grid { grid-template-columns: 1fr; gap: 24px; } }
  .main-img { aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: #ececf2; }
  .thumbs { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .thumbs button { width: 64px; height: 64px; border-radius: 10px; padding: 0; overflow: hidden; border: 2px solid transparent; background: none; cursor: pointer; }
  .thumbs button.on { border-color: var(--obsidian); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .desc { color: #26262d; margin: 0 0 28px; font-size: 15px; line-height: 1.6; }
  .desc p, .desc ul { margin: 0 0 16px; }
  .desc .desc-lead { font: 700 17px/1.45 var(--display); color: var(--obsidian); letter-spacing: -.01em; }
  .desc .desc-label { font: 600 12px var(--ui); text-transform: uppercase; letter-spacing: .08em; color: var(--charcoal); margin: 22px 0 8px; }
  .desc ul { padding-left: 18px; margin-top: 0; }
  .desc li { margin-bottom: 4px; }
  .desc .desc-closing { color: var(--obsidian); padding-top: 14px; border-top: 1px solid rgba(0,0,0,.08); margin-bottom: 0; }
  .desc a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .size-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  button.link { font: 500 14px var(--ui); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: var(--blue); text-underline-offset: 3px; color: inherit; }
  .sizes { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .size { min-width: 56px; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--hairline); background: var(--paper); font: 600 15px var(--display); cursor: pointer; transition: border-color .2s, background .2s, color .2s; }
  .size:hover:not(:disabled) { border-color: var(--obsidian); }
  .size.on { background: var(--obsidian); color: #fff; border-color: var(--obsidian); }
  .size.out { color: #b0b0bb; text-decoration: line-through; cursor: not-allowed; background: transparent; }
  .note { color: var(--charcoal); font-size: 14px; margin: 0 0 16px; }
  .note.delivery { margin: 22px 0 0; padding-top: 16px; border-top: 1px solid rgba(0,0,0,.08); }
  .btn { display: inline-block; font: 500 16px var(--display); text-decoration: none; padding: 14px 32px; border-radius: 100px; border: 1px solid transparent; cursor: pointer; }
  .btn.primary { background: var(--obsidian); color: #fff; box-shadow: var(--shadow-btn); }
  .btn.primary:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { border-color: var(--obsidian); }
  dialog#chart { border: 0; border-radius: 18px; padding: 0; width: min(560px, 92vw); box-shadow: 0 30px 80px rgba(7,7,9,.3); }
  dialog#chart::backdrop { background: rgba(7,7,9,.45); }
  #chart-body { padding: 28px; position: relative; }
  #chart-body h2 { margin: 0 0 8px; letter-spacing: -.03em; }
  .x { position: absolute; top: 14px; right: 16px; font-size: 26px; line-height: 1; border: 0; background: none; cursor: pointer; }
  .tscroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font: 500 15px var(--ui); }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
  th { color: var(--charcoal); font-weight: 600; }
  footer { max-width: 1100px; margin: 0 auto; padding: 0 24px 40px; color: var(--charcoal); font: 400 14px var(--ui); }
  footer a { color: inherit; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .ghost-logo { width: 22px; height: 26px; color: var(--obsidian); }
  .pname { font-size: clamp(26px, 4vw, 34px); letter-spacing: -.04em; line-height: 1.1; margin: 0 0 4px; }
  .shop-title { margin-bottom: 28px; }
  .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 26px; }
  .pick { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 14px; border: 1.5px solid var(--hairline); background: var(--paper); cursor: pointer; text-align: left; font: 600 14px/1.25 var(--display); color: inherit; transition: border-color .2s; }
  .pick:hover { border-color: var(--obsidian); }
  .pick.on { border-color: var(--obsidian); box-shadow: inset 0 0 0 1px var(--obsidian); }
  .pick img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: none; }
  .pick small { display: block; font: 500 13px var(--ui); color: var(--charcoal); margin-top: 2px; }
  /* Compact store layout (12 Nov 2026): shirt, size and Buy fit on a laptop screen without scrolling */
  @media (min-width: 801px) {
    main { padding-top: 28px; }
    .shop-title { font-size: 36px; margin-bottom: 18px; }
    .product-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; }
    .gallery { position: sticky; top: 84px; }
    .main-img { width: min(100%, calc(100vh - 200px)); }
    html, body { overflow-x: clip; }   /* clip, not hidden: hidden turns body into a scroll box and stops the sticky gallery */
  }
  .picks { gap: 8px; margin-bottom: 18px; }
  .pick { padding: 6px 10px 6px 6px; }
  .pick img { width: 36px; height: 36px; }
  .pname { font-size: clamp(24px, 3vw, 30px); }
  .price.big { font-size: 19px; margin: 2px 0 10px; }
  .desc { margin-bottom: 16px; font-size: 14.5px; line-height: 1.55; }
  .desc p, .desc ul { margin-bottom: 10px; }
  .desc .desc-lead { font-size: 16px; }
  .desc .desc-label { margin: 12px 0 4px; }
  .desc li { margin-bottom: 2px; }
  .size-head { margin-bottom: 8px; }
  .sizes { gap: 8px; margin-bottom: 14px; }
  .size { min-width: 48px; padding: 10px 9px; font-size: 14px; border-radius: 10px; }
  .buyrow { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .buyrow .note { margin: 0; }
  .note.delivery { margin-top: 16px; padding-top: 12px; }
  .desc.after { margin: 18px 0 0; }
  .main-img { position: relative; cursor: zoom-in; }
  .main-img:focus-visible { outline: 2px solid var(--obsidian); outline-offset: 3px; }
  .zoom-ico { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.88); color: var(--obsidian); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.15); pointer-events: none; }
  dialog#zoom { width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: rgba(7,7,9,.95); overflow: hidden; }
  dialog#zoom::backdrop { background: rgba(7,7,9,.95); }
  #zoom-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #zoom-img { max-width: min(94vw, 1100px); max-height: 90vh; object-fit: contain; cursor: zoom-in; touch-action: none; user-select: none; -webkit-user-drag: none; transition: transform .2s ease; }
  dialog#zoom.zoomed #zoom-img { transform: scale(2.5); transition: none; cursor: zoom-out; }
  .zbtn { position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: var(--obsidian); font: 500 22px/1 var(--ui); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; }
  .zbtn[hidden] { display: none; }
  #zoom-x { top: 16px; right: 16px; }
  #zoom-prev { left: 16px; top: 50%; transform: translateY(-50%); }
  #zoom-next { right: 16px; top: 50%; transform: translateY(-50%); }
  #zoom-count { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.8); font: 500 13px var(--ui); z-index: 2; pointer-events: none; }
</style>
